# Runtime configuration for xbox_plc_teleop
# Run from the repository root: sudo ./build/xbox_plc_teleop
# This enables real UDP sending. The joystick still requires RB and valid PLC replies.
plc_ip=192.168.2.69
plc_port=1101
local_port=1101
udp_enabled=true
max_vx_mps=0.2
max_vy_mps=0.2
max_wz_radps=0.2
